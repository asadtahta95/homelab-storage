# Example Prometheus config. Copy to prometheus.yml and adjust targets.
# WARNING: never commit real bearer tokens - keep prometheus.yml out of git
# (it is covered by *.yml? No - prometheus.yml IS committed here as example
#  only; your real file may contain tokens, so .gitignore it on your server).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-local"
    static_configs:
      - targets: ["<server-lan-ip>:9100"]
    # Run node-exporter on the host for this:
    # docker run -d --name node-exporter --restart unless-stopped -p 9100:9100 \
    #   -v /proc:/host/proc:ro -v /sys:/host/sys:ro -v /:/rootfs:ro,rslave \
    #   prom/node-exporter:latest \
    #   --path.procfs=/host/proc --path.sysfs=/host/sys \
    #   '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'

  - job_name: "mktxp"
    static_configs:
      - targets: ["mktxp:49090"]

