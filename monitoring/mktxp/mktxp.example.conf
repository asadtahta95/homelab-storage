# Copy to mktxp.conf and fill in your MikroTik credentials.
# NEVER commit the real mktxp.conf (it holds a router login).
[default]
    enabled = True
    hostname = 192.168.88.1
    port = 8728
    username = monitor
    password = CHANGE_ME
    use_ssl = False
    no_ssl_certificate = False
    ssl_certificate_verify = False
    ssl_check_hostname = False
    plaintext_login = True
    routerboard = True
    health = True
    installed_packages = False
    dhcp = True
    dhcp_lease = True
    connections = True
    connection_stats = False
    interface = True
    route = True
    pool = True
    firewall = True
    neighbor = True
    poe = False
    monitor = True
